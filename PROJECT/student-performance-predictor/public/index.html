<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Performance Predictor</title><link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container"><section class="card">
<h1>Student Performance Predictor</h1>
<p class="subtitle">Enter student details to predict the final score.</p>
<form id="predictionForm">
<label for="study_hours">Study hours per day</label>
<input id="study_hours" type="number" min="0" max="12" step="0.1" value="5" required>
<label for="attendance">Attendance (%)</label>
<input id="attendance" type="number" min="0" max="100" value="85" required>
<label for="previous_score">Previous exam score</label>
<input id="previous_score" type="number" min="0" max="100" value="72" required>
<button type="submit">Predict Score</button>
</form>
<div id="result" class="result hidden"><span>Predicted final score</span>
<strong id="prediction">--</strong><p id="message"></p></div>
<p id="error" class="error hidden"></p>
</section><footer>Classroom demo • Python + scikit-learn + Vercel</footer></main>
<script src="script.js"></script>
</body></html>
